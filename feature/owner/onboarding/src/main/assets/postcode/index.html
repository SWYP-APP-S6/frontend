<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>주소 검색</title>
    <style>
        html, body, #postcode { width: 100%; height: 100%; margin: 0; }
    </style>
</head>
<body>
<div id="postcode"></div>
<script>
    function sendPostcodeMessage(payload) {
        window.MangroPostcode.postMessage(JSON.stringify(payload));
    }

    function startPostcode() {
        try {
            new kakao.Postcode({
                width: '100%',
                height: '100%',
                onresize: function () {
                    sendPostcodeMessage({type: 'ready'});
                },
                oncomplete: function (data) {
                    sendPostcodeMessage({
                        type: 'complete',
                        zonecode: data.zonecode,
                        address: data.userSelectedType === 'R' ? data.roadAddress : data.jibunAddress
                    });
                }
            }).embed(document.getElementById('postcode'), {autoClose: false});
        } catch (error) {
            sendPostcodeMessage({type: 'error'});
        }
    }
</script>
<script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"
        onload="startPostcode()"
        onerror="sendPostcodeMessage({type: 'error'})"></script>
</body>
</html>
